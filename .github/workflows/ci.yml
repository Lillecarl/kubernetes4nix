name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

jobs:
  # Every list the other jobs matrix over comes from versions.json or the
  # flake, so a new version or channel is built without editing this file.
  matrix:
    name: Derive the matrix
    runs-on: ubuntu-24.04
    outputs:
      channels: ${{ steps.derive.outputs.channels }}
      source: ${{ steps.derive.outputs.source }}
      binaries: ${{ steps.derive.outputs.binaries }}
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
      - id: derive
        name: Read the channels and the supported versions
        run: |
          channels=$(nix eval '.#legacyPackages.x86_64-linux' --apply builtins.attrNames --json)
          source=$(jq -c '[.releases[] | select(.supported or .development) | .patches[].version]' versions.json)
          binaries=$(jq -c '
            [.releases[] | select(.supported or .development) | . as $series
             | $series.patches[]
             | {
                 version,
                 flavors: (["client"]
                   + (if .version == $series.latest then ["server", "node"] else [] end)),
               }]
          ' versions.json)
          {
            echo "channels=$channels"
            echo "source=$source"
            echo "binaries=$binaries"
          } >> "$GITHUB_OUTPUT"

  eval:
    name: Evaluate the flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
            cores = 4
            max-jobs = 1
      - name: Check that every output evaluates
        run: nix flake check --no-build --print-build-logs
        timeout-minutes: 45

  source:
    name: Source ${{ matrix.channel }} ${{ matrix.version }}
    needs:
      - matrix
    # The 93 version builds run on main, on the schedule, and on the update
    # pull request, which carries the automerge label. Ordinary pull requests
    # only evaluate the flake and build the archives.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'automerge')
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        channel: ${{ fromJSON(needs.matrix.outputs.channels) }}
        version: ${{ fromJSON(needs.matrix.outputs.source) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Make room on the runner
        run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
        timeout-minutes: 10
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
            cores = 4
            max-jobs = 1
      - uses: cachix/cachix-action@master
        with:
          name: kubernetes4nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Build and push kubernetes-${{ matrix.version }} on ${{ matrix.channel }}
        run: >-
          nix build --no-link --print-build-logs --keep-going
          ".#legacyPackages.x86_64-linux.\"${{ matrix.channel }}\".packages.\"kubernetes-${{ matrix.version }}\""
        timeout-minutes: 120
    timeout-minutes: 150

  binaries:
    name: Binaries ${{ matrix.channel }} ${{ matrix.entry.version }}
    needs:
      - matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        channel: ${{ fromJSON(needs.matrix.outputs.channels) }}
        entry: ${{ fromJSON(needs.matrix.outputs.binaries) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Make room on the runner
        run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
        timeout-minutes: 10
      - uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
            cores = 4
            max-jobs = 1
      - uses: cachix/cachix-action@master
        with:
          name: kubernetes4nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Build and push release archives for ${{ matrix.entry.version }} on ${{ matrix.channel }}
        run: |
          for flavor in ${{ join(matrix.entry.flavors, ' ') }}; do
            nix build --no-link --print-build-logs --keep-going \
              ".#legacyPackages.x86_64-linux.\"${{ matrix.channel }}\".packages.\"kubernetes-${flavor}-${{ matrix.entry.version }}\""
          done
        timeout-minutes: 45
    timeout-minutes: 60
